name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # System macOS Python may omit the SQLite extension API required by sqlite-vec.
      UV_MANAGED_PYTHON: 'true'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        python-version:
          - '3.12'
        include:
          # The oldest version requires-python allows, so the floor stays true.
          - os: ubuntu-latest
            python-version: '3.11'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Synchronize development environment
        run: uv sync --frozen --group dev

      - name: Run warning-strict test suite
        run: uv run --no-sync pytest -W error

      - name: Report stale mapping receipts
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        # Warn-only while receipts already known to be stale await a named
        # approver's refresh. Drop --warn-only to make a stale receipt fail CI.
        run: uv run --no-sync dag-tool mapping receipt check --project-path . --format github --warn-only
