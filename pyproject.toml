[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "aio-agentic-sdlc"
dynamic = ["version"]
description = "Deterministic 3D Matrix Backlog Manager for Agentic Workflows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "PolyForm Noncommercial License 1.0.0" }
authors = [
  { name="aegolius-labs" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
]
dependencies = [
    "filelock>=3.32.2",
    "mcp>=2.0.0,<3",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "click>=8.0.0",
    "tree-sitter>=0.25.2,<0.26",
    "tree-sitter-python>=0.25.0,<0.26",
    "google-antigravity",
    "jinja2>=3.1.6",
]

[project.optional-dependencies]
# Duplicate PRD detection only. It pulls in torch, which dominates install time
# and would otherwise delay every MCP server start.
semantic = [
    "sentence-transformers>=5.7.0",
    "numpy>=2.2.6",
    "sqlite-vec>=0.1.9",
]

[project.urls]
"Homepage" = "https://github.com/aegolius-labs/aio-agentic-sdlc"
"Bug Tracker" = "https://github.com/aegolius-labs/aio-agentic-sdlc/issues"

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.14.0",
    "black>=25.9.0",
    "aio-agentic-sdlc[semantic]",
]

[project.scripts]
aio-agentic-sdlc = "aio_agentic_sdlc.cli:main"
agb = "aio_agentic_sdlc.cli:main"
aio-agentic-sdlc-mcp = "aio_agentic_sdlc.mcp_server:main"
dag-tool = "aio_agentic_sdlc.dag_cli:cli"
aio-sdlc = "aio_agentic_sdlc.cli:main"

[tool.hatch.version]
source = "vcs"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  "error:coroutine .* was never awaited:RuntimeWarning",
  "error::pytest.PytestUnraisableExceptionWarning",
]
