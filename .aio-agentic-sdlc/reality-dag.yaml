- id: 01972ce1-dba9-54a3-9f75-771d02ad2cec
  type: agent
  name: sdlc_architect
  description: Subagent responsible for software architecture research, component
    breakdown, generating SDDs, and updating the Intention DAG.
- id: c5136308-b1db-530b-99f3-6c1956c46d5e
  type: agent
  name: sdlc_cartographer
  description: Subagent responsible for invoking the Reality DAG Generator and calculating
    the Backlog Diff using the framework CLI tools.
- id: 0e159810-cde1-5fb7-9250-9e1e63b47898
  type: agent
  name: sdlc_devops
  description: Subagent responsible for strict VCS operations, selective staging,
    Conventional Commits, Conventional Branches, and Pull Request generation.
- id: e45f0d86-76ad-5d0f-a05e-150921499094
  type: agent
  name: sdlc_implementer
  description: Subagent responsible for executing code changes using Test-Driven Development
    based on Architect plans.
- id: 3dc0533b-0263-5cf9-aef5-46b0afef9161
  type: agent
  name: sdlc_intake
  description: Acts as a product manager. Distills user requirements into formal Product
    Requirement Documents (PRDs) under .aio-agentic-sdlc/specs/<feature-name>/.
- id: 6d9e067b-64b4-5188-9e71-6b66a981676b
  type: agent
  name: sdlc_linter
  description: Subagent responsible for static analysis, code formatting, security
    checks, and linting.
- id: fe0d8f57-f8d2-5d80-9680-e2f44c137f0a
  type: agent
  name: sdlc_orchestrator
  description: The central Orchestrator agent that manages the Software Development
    Life Cycle, delegating work to specialized subagents.
- id: bdffa5b3-fa12-54cf-99c0-a567938595f5
  type: agent
  name: sdlc_qa
  description: Subagent responsible for comprehensive testing, fuzzing, and adversarial
    code validation.
- id: bdf19ef6-c810-53c0-8562-914d4bc3b507
  type: agent
  name: sdlc_researcher
  description: Subagent responsible for deep technical and product viability research,
    acting as a Research Swarm Orchestrator.
- id: 1f2db192-e092-5b9f-b281-878f83be11a1
  type: agent
  name: sdlc_scribe
  description: Subagent responsible for updating user-facing documentation (README,
    CONTRIBUTING, docs/) to align with reality before delivery.
