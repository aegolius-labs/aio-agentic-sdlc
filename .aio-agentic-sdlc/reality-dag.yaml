    \    definition, decorators included, starts on the line the receipt occupied.\n\
    \    The digest covers only that definition's lines: moving it or editing the\n\
    \    rest of the file leaves the digest unchanged, while any edit inside it,\n\
    \    including a rename, changes or invalidates it.\n    "
- id: df736232-96a5-5ac3-9962-e026eda094da
