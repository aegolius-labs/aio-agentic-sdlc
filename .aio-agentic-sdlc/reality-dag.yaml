- id: 3337985c-d662-5f20-b465-e2cfe35cbb59
  type: component
  name: mapping_receipt_freshness
  description: "Check whether one source file's mapping receipt still matches its\
    \ source.\n\n    Returns ``None`` when the file carries no receipt. A receipt\
    \ with\n    ``symbol_sha256`` binds to its symbol's source; an older one binds\
    \ to the\n    whole annotation-neutral file through ``source_sha256``. The status\
    \ is\n    ``fresh`` when the source the receipt binds to is unchanged, ``stale``\
    \ when\n    it changed since approval, and\n    ``invalid`` when the receipt cannot\
    \ be validated at all. Read-only: a stale\n    receipt is refreshed only through\
    \ ``dag-tool mapping receipt refresh`` with\n    a named approver.\n    "
