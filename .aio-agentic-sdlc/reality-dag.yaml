- id: 54c1a005-787a-5953-a28a-212cac729c7d
  type: component
  name: authorized_subjects
  description: "Return the triage subject keys whose implementation is authorized.\n\
    \n    Only approved intent that triage classifies as ``missing_implementation``\n\
    \    or ``acceptance_evidence_required`` is authorized, so unapproved intent\n\
    \    never reaches an implementing agent.\n    "
- id: 2ebf00ef-c11d-501f-add4-f86a1df8be8a
  type: component
  name: ingest_diff
  description: "\n    Loads intention/reality DAGs via DAGManager, uses DiffingEngine\
    \ to calculate the diff,\n    and merges the resulting tasks and edges into the\
    \ local framework backlog\n    using core.load_backlog and core.save_backlog,\
    \ followed by core.prioritize_items.\n\n    Each ingested task records whether\
    \ drift triage authorizes its\n    implementation. The backlog equals the diff:\
    \ a diff task that is no longer\n    in the diff completes, and a completed one\
    \ that is back in the diff\n    reopens. In the default `gated` approval mode\
    \ a task that left the diff\n    waits for `aio-sdlc approve` instead of completing\
    \ (Approval Gate). Other execution state of tasks already in the backlog is kept,\n\
    \    and items not cut from the diff are never touched.\n    "
- id: 5e17f1b2-cfc1-56da-a987-55a688bb2061
  type: component
  name: work_order
  description: "Return the prompt an implementing agent receives for one task.\n\n\
    \    A diff task names its canonical intent only by GUID. The agent needs the\n\
    \    intent itself, so the work order carries the node's name, description,\n\
    \    provenance and acceptance criteria with their required evidence, plus the\n\
    \    rules that keep approval with people. Nothing here is new intent: it is\n\
    \    copied from the approved Intention node.\n    "
- id: aa788b5d-b918-5414-b688-a1db5fda7ea4
  type: component
  name: execute_task_with_agent
  description: "Run the task on the configured agent runtime as the sdlc_orchestrator.\n\
    \n    The runtime is chosen by configuration (see ``agent_runtime``), so the\n\
    \    loop has no dependency on any one vendor's SDK.\n    "
- id: 47757762-ac3c-582e-a93a-0bee49c1de94
  type: component
  name: main_loop
  description: "\n    1. Invokes ingest_diff().\n    2. Fetches the highest-priority\
    \ unblocked task that triage authorizes\n       for implementation via core.get_next_item().\n\
    \    3. Sets task status to 'In Progress' via core.set_status().\n    4. Awaits\
    \ execute_task_with_agent(task).\n    5. Blocks the task as awaiting evidence\
    \ (or 'Blocked' on failure). An\n       agent returning is not evidence; the next\
    \ ingest completes the task\n       only if it has left the diff.\n\n    Returns\
    \ the executed task's name, or None when nothing is authorized.\n    "
